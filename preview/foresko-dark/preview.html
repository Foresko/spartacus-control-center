  };
  const defaults = {
    aurora: {background:'#000000',panels:'#1C1C1D',separator:'#383839',text:'#FEFEFF',secondary:'#8E8E93',inactive:'#58585C',normal:'#30D158',warning:'#FFD60A',critical:'#FF453A',scenario:'stress'},

  };
  const states = {};
  const components = {};
  function restore(snapshot) {
    const stored = snapshot?.modelContent?.spartacusLcd;
    const saved = [2,3,4,5,6].includes(stored?.version) && stored?.paletteId === 'ios26-dark' ? stored : null;
    for (const name of Object.keys(defaults)) {
      const next = {...defaults[name]};
      if (saved?.palettes?.[name]) {
        for (const key of Object.keys(next)) {
          const value = saved.palettes[name][key];
          if (key === 'scenario' && Object.hasOwn(samples, value)) next[key] = value;
          else if (key !== 'scenario' && typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)) {
            next[key] = key === 'warning' && stored.version < 5 && value.toUpperCase() === '#FF9F0A' ? '#FFD60A' : value;

    component.select.value = state.scenario;
    component.status.textContent = name === 'cards' ? `CPU ${data.cpu_temp}° · GPU-1 ${data.gpu_temp}° · GPU-2 ${data.gpu2_temp}°` : `CPU ${data.cpu_temp}° · GPU ${data.gpu_temp}°`;
    const gpuDetail = name === 'cards' ? `GPU-1 ${data.gpu_temp} градусов, нагрузка ${data.gpu_usage} процентов; GPU-2 ${data.gpu2_temp} градусов, нагрузка ${data.gpu2_usage} процентов` : `GPU ${data.gpu_temp} градусов, нагрузка ${data.gpu_usage} процентов`;
    const headerDetail = name === 'cards' ? `SSD ${data.disk_pct.toFixed(0)} процента в правом верхнем углу. ` : '';
    component.canvas.setAttribute('aria-label',`Тестовый дисплей ${name}, все данные моковые. ${headerDetail}Карточки: CPU ${data.cpu_temp} градусов, нагрузка ${data.cpu_usage} процентов, ${data.cpu_watts} Вт; ${gpuDetail}; мощности GPU-1 ${data.gpu_watts} Вт и GPU-2 ${data.gpu2_watts} Вт; RAM ${data.ram_used} из ${data.ram_total} ГБ; помпа ${data.pump_pct} процентов, ${data.pump_rpm} оборотов в минуту; вентиляторы ${data.fan_pct} процентов, ${data.fan_rpm} оборотов в минуту. Цвет шкал CPU и GPU зависит от температуры, RAM — от заполнения. Сумма CPU и двух GPU ${data.component_watts ?? 'нет данных'} Вт, без остальных компонентов ПК.`);
  }
  for (const name of Object.keys(specs)) {
    const unit = document.getElementById(`spartacus-${name}`);
    const stage = unit.closest('.lcd-stage');
    components[name] = {unit,canvas:unit.querySelector('canvas'),select:stage.querySelector('select'),status:stage.querySelector('.lcd-status')};
    components[name].select.addEventListener('change',event => {
      states[name].scenario=event.target.value;
      draw(name);save();
    });
    draw(name);
    if (globalThis.Tweak) {
      const state = states[name];
      const tweak = new Tweak({container:unit,onChange:() => {draw(name);save();}});
      const labels = {background:'Фон экрана',panels:'Фон карточек',separator:'Разделители',text:'Основной текст',secondary:'Вторичный текст',inactive:'Неактивные элементы',normal:'Норма',warning:'Предупреждение',critical:'Критично'};
      for (const key of Object.keys(state)) {
        if (key !== 'scenario') tweak.addColorPicker(state,key,{label:labels[key],reference:`${name}.${key}`});
      }
    }
  }
  window.addEventListener('openai:set_globals',event => {
    if (event.detail?.globals && Object.hasOwn(event.detail.globals,'widgetState')) {
      restore(event.detail.globals.widgetState);
      Object.keys(specs).forEach(draw);
    }
  });
})();
</script>
